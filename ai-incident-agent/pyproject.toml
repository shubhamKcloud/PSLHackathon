[project]
name = "ai-incident-agent"
version = "0.1.0"
description = "AI-powered incident monitoring, analysis, ticketing, and remediation agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "Your Name", email = "you@example.com" } ]

dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0",
  "watchdog>=3.0",
  "requests>=2.0",
  "python-dotenv>=1.0",
  "flask>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
